# Continuous Integration (CI) to Build & Test & Coverage & Lint.
# ~~
name: CI
on:
  pull_request:
    branches: [ master, '**' ]
  push:
    branches: [ master, '2.0' ]

env:
  ACTIONS_ALLOW_UNSECURE_COMMANDS: true

jobs:
  validate:
    name: Validate Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '11'
          cache: 'sbt'

      - name: Set up Scala and sbt
        uses: olafurpg/setup-scala@v14
        with:
          java-version: '11'
          #          scala-version: '2.13.10'
          sbt-version: '1.8.2'

      - name: Validate Code
        run: sbt validateCode

  build:
    name: Build & Test
    needs: [ validate ]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: true
      matrix:
        # each Scala line runs its own aggregate (build.sbt, ci_*): the root mixes lines
        include:
          - scala: '2.12.18'
            line: 'ci_scala212'
          - scala: '2.13.18'
            line: 'ci_scala213'
          - scala: '3.2.2'
            line: 'ci_scala3'
          - scala: '3.3.8'
            line: 'ci_scala33'

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '11'
          cache: 'sbt'

      - name: Set up Scala and sbt
        uses: olafurpg/setup-scala@v14
        with:
          java-version: '11'
          #          scala-version: '2.13.10'
          sbt-version: '1.8.2'

      - name: Build & Test
        run: sbt ++${{ matrix.scala }} "project ${{ matrix.line }}" clean testWithCoverage

      - name: Upload coverage report (all)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.scala }}
          path: ${{github.workspace}}/target/scala-${{ matrix.scala }}/coverage-report

  engine-matrix:
    name: Engine Matrix
    needs: [ validate ]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        # every stream module's specs on each engine x consumer (openai-matrix/*, build.sbt)
        include:
          - scala: '2.12.18'
            line: 'ci_matrix212'
          - scala: '2.13.18'
            line: 'ci_matrix213'
          - scala: '3.2.2'
            line: 'ci_matrix3'

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '11'
          cache: 'sbt'

      - name: Set up Scala and sbt
        uses: olafurpg/setup-scala@v14
        with:
          java-version: '11'
          sbt-version: '1.8.2'

      - name: Engine x consumer matrix
        run: sbt ++${{ matrix.scala }} "project ${{ matrix.line }}" test

  optional-build:
    name: Build (Optional)
    continue-on-error: ${{ matrix.experimental }}
    needs: [ validate ]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: true
      matrix:
        distribution: [ 'corretto' ]
        jdk: [ '11' ]
        scala: [ '2.12.18', '2.13.18', '3.2.2']
        experimental: [ false ]
        include:
          - scala: '2.12.18'
            line: 'ci_scala212'
          - scala: '2.13.18'
            line: 'ci_scala213'
          - scala: '3.2.2'
            line: 'ci_scala3'
          - jdk: '17'
            distribution: 'corretto'
            scala: '2.13.18'
            line: 'ci_scala213'
            experimental: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup JDK
        uses: actions/setup-java@v3
        with:
          distribution: ${{ matrix.distribution }}
          java-version: ${{ matrix.jdk }}
          cache: 'sbt'

      - name: Set up Scala and sbt
        uses: olafurpg/setup-scala@v14
        with:
          java-version: ${{ matrix.jdk }}
          #          scala-version: '2.13.10'
          sbt-version: '1.8.2'

      - name: Perform Build / Test
        run: sbt ++${{ matrix.scala }} "project ${{ matrix.line }}" clean compile test

  #  coverage:
  #    name: Coverage Report
  #    if: ${{ github.event.pull_request }}
  #    needs: [ build ]
  #    runs-on: ubuntu-latest
  #    steps:
  #      - uses: actions/download-artifact@v3
  #        with:
  #          name: cobertura.xml
  #
  #      - name: Analyzing coverage report
  #        uses: 5monkeys/cobertura-action@master
  #        with:
  #          path: cobertura.xml
  #          only_changed_files: true
  #          fail_below_threshold: true
  #          show_missing: true
  #          show_line: true
  #          show_branch: true
  #          show_class_names: true
  #          link_missing_lines: true
  #          minimum_coverage: 75

  ready-to-merge:
    name: Ready to Merge
    if: ${{ github.event.pull_request }}
    needs: [ optional-build ]
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Ready to merge.'